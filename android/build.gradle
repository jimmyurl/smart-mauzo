plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.smart_mauzo"
    compileSdkVersion = 34
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.example.smart_mauzo"
        minSdkVersion = 27
        targetSdkVersion = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Enable multiDex if needed (for large apps)
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // Replace with your release config if needed
            minifyEnabled = true    // Enables code shrinking
            shrinkResources = true  // Removes unused resources (e.g., unused images)
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
            // Optional: Disable debug symbols for further size reduction
            ndk {
                debugSymbolLevel = 'SYMBOL_TABLE'
            }
        }
        debug {
            minifyEnabled = false
            shrinkResources = false
        }
    }

    // Optional: Split APKs by ABI to reduce per-APK size
    splits {
        abi {
            enable = true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk = false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.core:core-ktx:1.12.0"
    // Firebase BoM (keep only if you use Firebase; else remove)
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    // Add only the Firebase dependencies you actually use, e.g.:
    // implementation 'com.google.firebase:firebase-analytics'
}

flutter {
    source = "../.."
}